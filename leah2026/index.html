<!DOCTYPE html>
<html lang="zh">
<head>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  #hint {

  #subtitle {

    font-size: 13px;

    color: rgba(255, 210, 150, 0);

    transition: color 2.5s ease;
  }
  #subtitle.show { color: rgba(255, 210, 150, 0.85); }

  #arrived-hint {
    position: fixed;
    top: 24px;
    left: 50%;

    font-family: 'Georgia', serif;

    letter-spacing: 3px;

  }
  #arrived-hint.show { color: rgba(255, 210, 150, 0.55); }

  /* ── 弹窗 ── */
  #modal-overlay {
    display: none;

  }

  #modal {
    max-width: 560px;

    border: 1px solid rgba(255, 160, 90, 0.25);
    border-radius: 6px;
    padding: 40px 36px 32px;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.5s ease 0.15s, transform 0.5s ease 0.15s;
    font-family: 'Georgia', 'Songti SC', serif;
    color: rgba(255, 220, 170, 0.9);

    text-align: center;
  }
  #modal-overlay.show #modal {
    opacity: 1;
    transform: translateY(0);
  }

  #modal p {
    font-size: 15px;
    margin-bottom: 12px;
    letter-spacing: 1px;
  }

  #modal .modal-title {
    font-size: 18px;
    letter-spacing: 4px;
    color: rgba(255, 200, 140, 0.95);
    margin-bottom: 24px;
  }

  #modal .modal-btn {
    display: inline-block;
    margin-top: 20px;
    background: rgba(255, 140, 80, 0.15);
    border: 1px solid rgba(255, 160, 90, 0.4);
    color: rgba(255, 210, 150, 0.95);
    padding: 11px 36px;
    font-size: 13px;
    letter-spacing: 3px;
    font-family: 'Georgia', serif;
    cursor: pointer;
    transition: background 0.3s, border-color 0.3s;
  }
  #modal .modal-btn:hover {
    background: rgba(255, 140, 80, 0.32);
    border-color: rgba(255, 160, 90, 0.75);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">↑↓ · 纵深 &nbsp;｜&nbsp; A/D · 左右 &nbsp;｜&nbsp; W/S · 上下 &nbsp;｜&nbsp; ←/→ · 旋转</div>
<div id="buttons">
  <button class="btn" id="reset-btn" onclick="doReset()">↺ 重置</button>
  <button class="btn" id="auto-btn"  onclick="toggleAuto()">✦ 自动导览</button>
</div>
<div id="subtitle">— for Leah 莉娅 · 生日快乐 —</div>
<div id="arrived-hint">· 点击「继续」开启回忆之旅 ·</div>

<!-- 弹窗 -->
<div id="modal-overlay">
  <div id="modal">
    <p class="modal-title">致 Leah莉娅又迟到啦</p>
    <p>三年前刷到你的视频，从此每一次更新都成了我的小期待。</p>
    <p>看你从一血无伤到深渊教学，从直播间的欢笑到如今准备踏上新旅程——这三年，谢谢你带来的所有快乐。</p>
    <p>今天想用这份小小的礼物，陪你一起回头看看这些闪闪发光的日子。</p>
    <p style="margin-top: 8px; color: rgba(255, 180, 120, 0.75); font-size: 13px;">生日快乐，莉娅。愿新的一年，所有的勇敢都有回响。</p>
    <button class="modal-btn" onclick="location.href='story.html'">开启回忆之旅 →</button>
  </div>
</div>

<script>
'use strict';

// ─────────────────────────────────────────────
//  像素字体 (5行 x 3列位图)
// ─────────────────────────────────────────────
const GLYPHS = {
  'H': [0b101,0b101,0b111,0b101,0b101],
  'A': [0b010,0b101,0b111,0b101,0b101],
  'P': [0b110,0b101,0b110,0b100,0b100],
  'Y': [0b101,0b101,0b010,0b010,0b010],
  'B': [0b110,0b101,0b110,0b101,0b110],
  'I': [0b111,0b010,0b010,0b010,0b111],
  'R': [0b110,0b101,0b110,0b101,0b101],
  'T': [0b111,0b010,0b010,0b010,0b010],
  'D': [0b110,0b101,0b101,0b101,0b110],
  'E': [0b111,0b100,0b110,0b100,0b111],
  'L': [0b100,0b100,0b100,0b100,0b111],
};

function buildLayout(lines) {
  const all = [];
  let maxW = 0;
  const lineData = lines.map(str => {
    const pts = [];
    let cx = 0;
    for (const ch of str) {
      const g = GLYPHS[ch];
      if (!g) { cx += 2; continue; }
      for (let r = 0; r < 5; r++)
        for (let c = 0; c < 3; c++)
          if (g[r] & (1 << (2 - c))) pts.push([cx + c, r]);
      cx += 5;
    }
    return { pts, w: cx - 2 };
  });

  maxW = Math.max(...lineData.map(d => d.w));
  let baseY = 0;
  for (const { pts, w } of lineData) {
    const offX = (maxW - w) / 2;
    for (const [c, r] of pts) all.push([c + offX, r + baseY]);
    baseY += 8;
  }
  return { pixels: all, totalW: maxW, totalH: baseY - 3 };
}

const { pixels, totalW, totalH } = buildLayout(['HAPPY', 'BIRTHDAY', 'LEAH']);

// ─────────────────────────────────────────────
//  WebGL 初始化
// ─────────────────────────────────────────────
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
if (!gl) { document.body.innerHTML = '<p style="color:white;padding:40px">浏览器不支持 WebGL</p>'; throw ''; }

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();
window.addEventListener('resize', resize);

const VS = `
attribute vec3 aPos;
attribute vec3 aCol;
attribute float aSz;
uniform mat4 uVP;
uniform vec3 uCam;
varying vec3 vCol;
varying float vAlpha;
void main() {
  gl_Position = uVP * vec4(aPos, 1.0);
  float d = length(aPos - uCam);
  gl_PointSize = clamp(aSz * 90.0 / (d + 0.3), 1.0, 12.0);
  vCol   = aCol;
  vAlpha = clamp(1.3 - d / 22.0, 0.04, 1.0);
}`;

const FS = `
precision mediump float;
varying vec3  vCol;
varying float vAlpha;
void main() {
  vec2 uv = gl_PointCoord - 0.5;
  float r = length(uv);
  if (r > 0.5) discard;
  float core = smoothstep(0.28, 0.08, r);
  float glow = smoothstep(0.50, 0.20, r) * 0.35;
  float a    = (core + glow) * vAlpha;
  vec3 col   = mix(vCol, min(vCol * 1.8 + 0.25, 1.0), core * 0.5);
  gl_FragColor = vec4(col, a);
}`;

function mkShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    console.error('Shader:', gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, mkShader(gl.VERTEX_SHADER,   VS));
gl.attachShader(prog, mkShader(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
gl.useProgram(prog);

const LOC = {
  pos: gl.getAttribLocation(prog,  'aPos'),
  col: gl.getAttribLocation(prog,  'aCol'),
  sz:  gl.getAttribLocation(prog,  'aSz'),
  VP:  gl.getUniformLocation(prog, 'uVP'),
  cam: gl.getUniformLocation(prog, 'uCam'),
};

// ─────────────────────────────────────────────
//  粒子生成
// ─────────────────────────────────────────────
const CELL  = 0.30;
const CAM_Z = 20;
const OX    = totalW * CELL / 2;
const OY    = totalH * CELL / 2;

const rand = (a, b) => a + Math.random() * (b - a);

const LINE_COLORS = [
  [[1.0, 0.78, 0.18], [1.0, 0.60, 0.12], [1.0, 0.92, 0.38]],   // HAPPY  - 金橙
  [[1.0, 0.32, 0.52], [1.0, 0.48, 0.62], [0.95, 0.22, 0.42]],   // BDAY   - 玫瑰
  [[0.28, 0.85, 1.00],[0.18, 0.70, 0.95],[0.42, 0.95, 1.00]],   // LEAH   - 天蓝
];

const posArr = [], colArr = [], szArr = [];

const T_LAYERS = [12.0, 13.5, 15.0, 16.0, 17.0];
const JITTER   = 0.04;

for (const [px, py] of pixels) {
  const tx = px * CELL - OX;
  const ty = -(py * CELL - OY);

  const rdx = tx, rdy = ty, rdz = -CAM_Z;
  const rlen = Math.hypot(rdx, rdy, rdz);
  const dx = rdx / rlen, dy = rdy / rlen, dz = rdz / rlen;

  for (let k = 0; k < T_LAYERS.length; k++) {
    const t  = T_LAYERS[k] + rand(-0.3, 0.3);
    const jx = rand(-JITTER, JITTER);
    const jy = rand(-JITTER, JITTER);
    const jz = rand(-JITTER, JITTER);
    posArr.push(0 + t*dx + jx, 0 + t*dy + jy, CAM_Z + t*dz + jz);

    const row = py < 8 ? 0 : py < 16 ? 1 : 2;
    const cols = LINE_COLORS[row];
    const c = cols[k % cols.length];
    colArr.push(
      Math.min(1, c[0] + rand(-0.04, 0.04)),
      Math.min(1, c[1] + rand(-0.04, 0.04)),
      Math.min(1, c[2] + rand(-0.04, 0.04))
    );
    szArr.push(rand(0.6, 1.1));
  }
}

// 背景星尘
for (let i = 0; i < 800; i++) {
  posArr.push(rand(-15, 15), rand(-11, 11), rand(-5, 19));
  colArr.push(rand(0.12, 0.38), rand(0.12, 0.38), rand(0.32, 0.58));
  szArr.push(rand(0.08, 0.30));
}

const TOTAL = posArr.length / 3;

function mkBuf(data) {
  const b = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW);
  return b;
}
const BUF = { pos: mkBuf(posArr), col: mkBuf(colArr), sz: mkBuf(szArr) };

// ─────────────────────────────────────────────
//  矩阵（column-major）
// ─────────────────────────────────────────────
function perspectiveMat(fovY, aspect, near, far) {
  const f  = 1 / Math.tan(fovY / 2);
  const nf = 1 / (near - far);
  const m  = new Float32Array(16);
  m[0] = f / aspect; m[5] = f;
  m[10] = (far + near) * nf; m[11] = -1;
  m[14] = 2 * far * near * nf;
  return m;
}

function viewMat(cx, cy, cz, yaw, pitch) {
  const sy = Math.sin(yaw),   cya = Math.cos(yaw);
  const sp = Math.sin(pitch), cp  = Math.cos(pitch);
  const lx = sy*cp, ly = -sp, lz = -cya*cp;
  const rx = cya,   ry = 0,   rz = sy;
  const ux = -sy*sp, uy = cp, uz = cya*sp;
  const bx = -lx, by = -ly, bz = -lz;
  const m = new Float32Array(16);
  m[0]=rx; m[1]=ux; m[2]=bx; m[3]=0;
  m[4]=ry; m[5]=uy; m[6]=by; m[7]=0;
  m[8]=rz; m[9]=uz; m[10]=bz; m[11]=0;
  m[12]=-(rx*cx+ry*cy+rz*cz);
  m[13]=-(ux*cx+uy*cy+uz*cz);
  m[14]=-(bx*cx+by*cy+bz*cz);
  m[15]=1;
  return m;
}

function mulMat4(a, b) {
  const out = new Float32Array(16);
  for (let col = 0; col < 4; col++)
    for (let row = 0; row < 4; row++) {
      let s = 0;
      for (let k = 0; k < 4; k++) s += a[k*4+row] * b[col*4+k];
      out[col*4+row] = s;
    }
  return out;
}

// ─────────────────────────────────────────────
//  摄像机状态
// ─────────────────────────────────────────────
const SECRET = { x: 0, y: 0, z: CAM_Z, yaw: 0, pitch: 0 };
const INIT   = { x: 5, y: 2, z: 14,    yaw: 0.7, pitch: 0.15 };

const cam = { ...INIT };
let state = 'manual'; // 'manual' | 'auto-snap' | 'arrived'

// ─────────────────────────────────────────────
//  接近检测
// ─────────────────────────────────────────────
const SNAP_THRESHOLD = 2.5;

function distToSecret() {
  return Math.hypot(cam.x - SECRET.x, cam.y - SECRET.y, cam.z - SECRET.z)
       + Math.abs(cam.yaw   - SECRET.yaw)   * 4
       + Math.abs(cam.pitch - SECRET.pitch) * 4;
}

// ─────────────────────────────────────────────
//  键盘
// ─────────────────────────────────────────────
const keys = new Set();
window.addEventListener('keydown', e => {
  keys.add(e.code);
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code))
    e.preventDefault();
  if (state === 'auto-snap') {
    state = 'manual';
    document.getElementById('auto-btn').textContent = '✦ 自动导览';
  }
});
window.addEventListener('keyup', e => keys.delete(e.code));

function processKeys(dt) {
  if (state !== 'manual') return;
  const MOVE = 4.5 * dt;
  const TURN = 1.3 * dt;

  const fwdX = Math.sin(cam.yaw);
  const fwdZ = -Math.cos(cam.yaw);
  if (keys.has('ArrowUp'))   { cam.x += fwdX*MOVE; cam.z += fwdZ*MOVE; }
  if (keys.has('ArrowDown')) { cam.x -= fwdX*MOVE; cam.z -= fwdZ*MOVE; }

  if (keys.has('KeyA'))       cam.x -= Math.cos(cam.yaw) * MOVE;
  if (keys.has('KeyD'))       cam.x += Math.cos(cam.yaw) * MOVE;
  if (keys.has('KeyA'))       cam.z -= Math.sin(cam.yaw) * MOVE;
  if (keys.has('KeyD'))       cam.z += Math.sin(cam.yaw) * MOVE;

  if (keys.has('KeyW'))       cam.y += MOVE;
  if (keys.has('KeyS'))       cam.y -= MOVE;
  if (keys.has('ArrowLeft'))  cam.yaw -= TURN;
  if (keys.has('ArrowRight')) cam.yaw += TURN;

  if (distToSecret() < SNAP_THRESHOLD) startSnap();
}

// ─────────────────────────────────────────────
//  自动吸附
// ─────────────────────────────────────────────
let snapT    = 0;
let snapDur  = 3.0;
let snapFrom = { ...cam };

function startSnap() {
  if (state === 'arrived') return;
  state    = 'auto-snap';
  snapT    = 0;
  snapFrom = { x: cam.x, y: cam.y, z: cam.z, yaw: cam.yaw, pitch: cam.pitch };
  const d  = distToSecret();
  snapDur  = Math.max(1.2, Math.min(3.0, d * 0.8));
  document.getElementById('auto-btn').textContent = '✦ 吸附中…';
}

const lerp = (a, b, t) => a + (b - a) * t;
const ss   = t => { t = Math.max(0, Math.min(1, t)); return t*t*(3-2*t); };

const subtitle    = document.getElementById('subtitle');
const autoBtn     = document.getElementById('auto-btn');
const arrivedHint = document.getElementById('arrived-hint');
const hint        = document.getElementById('hint');
const tip         = document.getElementById('tip');

function updateSnap(dt) {
  if (state !== 'auto-snap') return;
  snapT += dt;
  const progress = ss(snapT / snapDur);
  cam.x     = lerp(snapFrom.x,     SECRET.x,     progress);
  cam.y     = lerp(snapFrom.y,     SECRET.y,     progress);
  cam.z     = lerp(snapFrom.z,     SECRET.z,     progress);
  cam.yaw   = lerp(snapFrom.yaw,   SECRET.yaw,   progress);
  cam.pitch = lerp(snapFrom.pitch, SECRET.pitch, progress);

  if (snapT >= snapDur) {
    Object.assign(cam, SECRET);
    state = 'arrived';
    subtitle.classList.add('show');
    arrivedHint.classList.add('show');
    hint.classList.add('hidden');
    // 到达后按钮变为"继续"
    autoBtn.textContent = '✦ 继续';
    autoBtn.onclick = showModal;
    document.getElementById('reset-btn').style.display = 'none';
  }
}

// ─────────────────────────────────────────────
//  弹窗
// ─────────────────────────────────────────────
function showModal() {
  document.getElementById('modal-overlay').classList.add('show');
}

// ─────────────────────────────────────────────
//  自动导览
// ─────────────────────────────────────────────
let autoNav = false;
let autoT   = 0;
let KF      = [];
let KF_END  = 0;

function buildKF() {
  const cx = cam.x, cy = cam.y, cz = cam.z;
  const yaw = cam.yaw, pitch = cam.pitch;

  const dist = Math.hypot(cx - SECRET.x, cy - SECRET.y, cz - SECRET.z)
             + Math.abs(yaw) * 5 + Math.abs(pitch) * 3;
  const dur  = Math.max(6, Math.min(20, dist * 1.4));

  KF = [
    { x: cx,   y: cy,   z: cz,    yaw: yaw,   pitch: pitch, t: 0 },
    { x: cx*0.6, y: cy*0.6, z: CAM_Z, yaw: yaw*0.5, pitch: pitch*0.5, t: dur*0.5 },
    { x: cx*0.1, y: cy*0.1, z: CAM_Z, yaw: yaw*0.08, pitch: pitch*0.05, t: dur*0.85 },
    { x: 0.3, y: 0.3, z: CAM_Z, yaw: 0.02, pitch: 0.01, t: dur },
  ];
  KF_END = dur;
}

function toggleAuto() {
  if (state === 'arrived') return;
  if (autoNav) {
    autoNav = false;
    state   = 'manual';
    autoBtn.textContent = '✦ 自动导览';
    return;
  }
  buildKF();
  autoNav = true;
  autoT   = 0;
  autoBtn.textContent = '✦ 取消';
}

function updateAutoNav(dt) {
  if (!autoNav || state !== 'manual') return;
  autoT += dt;

  if (autoT >= KF_END) {
    autoNav = false;
    startSnap();
    return;
  }

  let seg = KF.length - 2;
  for (let i = 0; i < KF.length - 1; i++)
    if (autoT < KF[i+1].t) { seg = i; break; }

  const a = KF[seg], b = KF[seg + 1];
  const st = ss((autoT - a.t) / (b.t - a.t));
  cam.x     = lerp(a.x,     b.x,     st);
  cam.y     = lerp(a.y,     b.y,     st);
  cam.z     = lerp(a.z,     b.z,     st);
  cam.yaw   = lerp(a.yaw,   b.yaw,   st);
  cam.pitch = lerp(a.pitch, b.pitch, st);

  if (distToSecret() < SNAP_THRESHOLD * 0.9) {
    autoNav = false;
    startSnap();
  }
}

// ─────────────────────────────────────────────
//  刷新
// ─────────────────────────────────────────────
function doReset() {
  Object.assign(cam, INIT);
  state   = 'manual';
  autoNav = false;
  autoT   = 0;
  subtitle.classList.remove('show');
  arrivedHint.classList.remove('show');
  hint.classList.remove('hidden');
  autoBtn.disabled = false;
  autoBtn.textContent = '✦ 自动导览';
  autoBtn.onclick = toggleAuto;
  document.getElementById('reset-btn').style.display = '';
}

// ─────────────────────────────────────────────
//  渲染循环
// ─────────────────────────────────────────────
gl.enable(gl.BLEND);
gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
gl.disable(gl.DEPTH_TEST);

let lastT = -1;

function render(now) {
  requestAnimationFrame(render);
  const t  = now * 0.001;
  const dt = lastT < 0 ? 0.016 : Math.min(t - lastT, 0.05);
  lastT = t;

  processKeys(dt);
  updateAutoNav(dt);
  updateSnap(dt);

  gl.clearColor(0.024, 0.024, 0.047, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT);

  const proj = perspectiveMat(Math.PI / 3.2, canvas.width / canvas.height, 0.1, 80);
  const view = viewMat(cam.x, cam.y, cam.z, cam.yaw, cam.pitch);
  const vp   = mulMat4(proj, view);

  gl.uniformMatrix4fv(LOC.VP,  false, vp);
  gl.uniform3f(LOC.cam, cam.x, cam.y, cam.z);

  function bind(buf, l, sz) {
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.enableVertexAttribArray(l);
    gl.vertexAttribPointer(l, sz, gl.FLOAT, false, 0, 0);
  }
  bind(BUF.pos, LOC.pos, 3);
  bind(BUF.col, LOC.col, 3);
  bind(BUF.sz,  LOC.sz,  1);

  gl.drawArrays(gl.POINTS, 0, TOTAL);
}

requestAnimationFrame(render);
</script>
